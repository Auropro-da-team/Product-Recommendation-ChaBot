version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - vscode-extensions:/home/vscode/.vscode-server/extensions
      - vscode-extensions-insiders:/home/vscode/.vscode-server-insiders/extensions
      # Optional: Mount your local gcloud config for GCP authentication
      # - ~/.config/gcloud:/home/vscode/.config/gcloud:ro
    command: sleep infinity
    networks:
      - app-network
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8001"  # Backend API
      - "5173:5173"  # Frontend Vite dev server
    depends_on:
      - chromadb

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "8000:8000"  # ChromaDB
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  vscode-extensions:
  vscode-extensions-insiders:
  chroma-data: